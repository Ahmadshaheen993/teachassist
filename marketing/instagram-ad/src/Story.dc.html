<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @font-face {
      font-family: "QG Display";
      src: url(data:font/woff2;base64,__FONT_B64__) format("woff2");
      font-weight: 100 900;
      font-style: normal;
      font-display: block;
    }
    body { margin: 0; }
    a { color: #F57005; }
    a:hover { color: #FF9A4D; }
  </style>
</helmet>

<div lang="ar" dir="rtl" style="width: 1080px; height: 1920px; position: relative; overflow: hidden; background: #05092D; font-family: 'QG Display', 'DIN Next LT Arabic', 'Tajawal', system-ui, sans-serif; box-sizing: border-box;">

  <!-- atmosphere -->
  <div style="position: absolute; top: -260px; right: -260px; width: 860px; height: 860px; border-radius: 50%; background: radial-gradient(circle, rgba(79,93,228,0.44) 0%, rgba(79,93,228,0) 68%);"></div>
  <div style="position: absolute; bottom: -260px; left: -280px; width: 840px; height: 840px; border-radius: 50%; background: radial-gradient(circle, rgba(0,147,137,0.34) 0%, rgba(0,147,137,0) 68%);"></div>
  <div style="position: absolute; inset: 0; background-image: linear-gradient(rgba(179,173,225,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(179,173,225,0.05) 1px, transparent 1px); background-size: 90px 90px;"></div>
  <div style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(5,9,45,0.55) 0%, rgba(5,9,45,0) 26%, rgba(5,9,45,0) 70%, rgba(5,9,45,0.80) 100%);"></div>

  <!-- content: kept inside the story safe area (280px top / 300px bottom stay clear of IG chrome) -->
  <div style="position: relative; height: 100%; box-sizing: border-box; padding: 280px 76px 300px; display: flex; flex-direction: column; justify-content: space-between;">

    <!-- header -->
    <div style="display: flex; flex-direction: column; gap: 40px; align-items: flex-start;">
      <img src="logo.png" alt="Q-Genius" style="height: 66px; width: auto; flex-shrink: 0; display: block;">
      <div style="display: flex; align-items: center; gap: 13px; padding: 13px 26px; border-radius: 999px; border: 1px solid rgba(179,173,225,0.34); background: rgba(19,25,79,0.55);">
        <span style="display: block; width: 10px; height: 10px; flex-shrink: 0; border-radius: 50%; background: #009389;"></span>
        <span style="font-size: 28px; font-weight: 500; color: #ACB3CD;">المنهج القطري · من الأول إلى الثاني عشر</span>
      </div>
    </div>

    <!-- headline -->
    <div style="display: flex; flex-direction: column; gap: 34px;">
      <div style="display: flex; flex-direction: column; gap: 2px;">
        <span style="font-size: 126px; font-weight: 900; line-height: 1.28; color: #FFFFFF;">درجاته تقدر</span>
        <span style="font-size: 126px; font-weight: 900; line-height: 1.28; color: #F57005;">تتغيّر.</span>
      </div>
      <div style="display: flex; align-items: center; gap: 20px;">
        <span style="display: block; width: 7px; height: 52px; flex-shrink: 0; border-radius: 4px; background: #009389;"></span>
        <span style="font-size: 42px; font-weight: 500; line-height: 1.4; color: #B3ADE1;">والبداية… حصّة وحدة.</span>
      </div>
    </div>

    <!-- feature rows -->
    <div style="display: flex; flex-direction: column; gap: 18px;">

      <div style="display: flex; align-items: center; gap: 24px; padding: 30px 32px; border-radius: 22px; border: 1px solid rgba(0,147,137,0.42); background: rgba(0,147,137,0.13);">
        <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#25C9BC" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;">
          <rect x="2" y="3.5" width="20" height="14" rx="2.5"></rect>
          <path d="M8 21h8"></path><path d="M12 17.5V21"></path>
          <circle cx="12" cy="9" r="2.4"></circle>
          <path d="M8.2 14.2a4.2 4.2 0 0 1 7.6 0"></path>
        </svg>
        <div style="display: flex; flex-direction: column; gap: 7px;">
          <span style="font-size: 40px; font-weight: 700; line-height: 1.25; color: #FFFFFF;">حصص VIP فردية أونلاين</span>
          <span style="font-size: 29px; font-weight: 500; line-height: 1.35; color: #ACB3CD;">تختار مدرّسك، وتختار وقتك</span>
        </div>
      </div>

      <div style="display: flex; align-items: center; gap: 24px; padding: 30px 32px; border-radius: 22px; border: 1px solid rgba(179,173,225,0.34); background: rgba(179,173,225,0.10);">
        <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#B3ADE1" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;">
          <path d="M4 5.5A1.5 1.5 0 0 1 5.5 4h4A2.5 2.5 0 0 1 12 6.5v13a2 2 0 0 0-2-2H5.5A1.5 1.5 0 0 1 4 16z"></path>
          <path d="M20 5.5A1.5 1.5 0 0 0 18.5 4h-4A2.5 2.5 0 0 0 12 6.5v13a2 2 0 0 1 2-2h4.5a1.5 1.5 0 0 0 1.5-1.5z"></path>
        </svg>
        <div style="display: flex; flex-direction: column; gap: 7px;">
          <span style="font-size: 40px; font-weight: 700; line-height: 1.25; color: #FFFFFF;">كورسات مسجّلة</span>
          <span style="font-size: 29px; font-weight: 500; line-height: 1.35; color: #ACB3CD;">يذاكر في وقته ويرجع للدرس قدّ ما يبي</span>
        </div>
      </div>

      <div style="display: flex; align-items: center; gap: 24px; padding: 30px 32px; border-radius: 22px; border: 1px solid rgba(245,112,5,0.42); background: rgba(245,112,5,0.13);">
        <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#FF9A4D" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;">
          <path d="M8 3.5h8a1.5 1.5 0 0 1 1.5 1.5v14A1.5 1.5 0 0 1 16 20.5H8A1.5 1.5 0 0 1 6.5 19V5A1.5 1.5 0 0 1 8 3.5z"></path>
          <path d="M9.6 9.4l1.5 1.5 3-3"></path>
          <path d="M9.6 15.4h4.8"></path>
        </svg>
        <div style="display: flex; flex-direction: column; gap: 7px;">
          <span style="font-size: 40px; font-weight: 700; line-height: 1.25; color: #FFFFFF;">اختبارات وبنوك أسئلة</span>
          <span style="font-size: 29px; font-weight: 500; line-height: 1.35; color: #ACB3CD;">أسئلة سنوات سابقة وتصحيح تلقائي</span>
        </div>
      </div>

    </div>

    <!-- cta -->
    <div style="display: flex; flex-direction: column; gap: 26px; align-items: center;">
      <div style="display: flex; align-items: center; justify-content: center; gap: 18px; width: 100%; box-sizing: border-box; padding: 30px 48px; border-radius: 999px; background: #F57005;">
        <span style="font-size: 46px; font-weight: 900; color: #05092D;">احجز حصّتك الحين</span>
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#05092D" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;">
          <path d="M19 12H5"></path><path d="M11 18l-6-6 6-6"></path>
        </svg>
      </div>
      <span style="font-size: 40px; font-weight: 700; color: #FFFFFF; letter-spacing: 0.6px; direction: ltr;">q-genius.com</span>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
