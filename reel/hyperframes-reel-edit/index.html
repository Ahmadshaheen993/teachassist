      tl.set("#cam-s4a", { transformOrigin: "50% 30%", scale: 1.04, x: 0, y: 0 }, 16.75);
      tl.to("#cam-s4a", { scale: 1.10, y: -4, duration: 0.5, ease: "power2.inOut" }, 17.73);  // push on المنصة
      tl.set("#cam-s4b", { transformOrigin: "50% 30%", scale: 1.16, x: 0, y: -8 }, 18.44);
      tl.set("#cam-s5", { transformOrigin: "50% 30%", scale: 1.14, x: 0, y: -6 }, 23.34);
